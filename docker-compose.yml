# Tools Portal: app + PostgreSQL.
# All configuration comes from the .env file next to this file (git-ignored, never committed):
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
# The portal is then served on http://10.0.10.106:8016

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tools_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the app container can reach the database.

  app:
    build: .
    image: tools-portal:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tools_portal}
      BACKUP_DIR: /app/backups
      PORT: "8016"
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:8016:8016"
    volumes:
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  backups:
